<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trina Kala | Connect</title>

<!-- Font Awesome -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #efe7d7;
  color: #2f251d;
  display: flex;
  justify-content: center;
  padding: 32px 16px;
}

.card {
  width: min(430px, 100%);
  text-align: center;
  background: #f8f2e7;
  border: 1px solid #c9b99d;
  border-radius: 28px;
  padding: 30px 22px 25px;
  box-shadow: 0 15px 45px #4b38201c;
}

/* Logo */
.logo {
  width: 150px;
  height: 150px;
  object-fit: contain;
  margin: 0 auto 8px;
  display: block;
}

.brand {
  font-size: 31px;
  letter-spacing: 4px;
  font-weight: 700;
}

.tag {
  font-size: 13px;
  letter-spacing: 1.5px;
  line-height: 1.6;
  margin: 9px 0 28px;
  color: #75614b;
}

/* Social links */
.social-link {
  display: flex;
  align-items: center;
  gap: 15px;
  text-decoration: none;
  color: #2f251d;
  background: #eadfc9;
  border: 1px solid #cdbb9d;
  border-radius: 16px;
  padding: 15px 18px;
  margin: 12px 0;
  font-weight: 700;
  transition: all 0.25s ease;
}

.social-link:hover {
  transform: translateY(-3px);
  background: #dfd0b4;
  box-shadow: 0 8px 20px rgba(75, 56, 32, 0.12);
}

/* Real icons */
.icon {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  flex-shrink: 0;
}

.social-name {
  flex: 1;
  text-align: left;
}

.arrow {
  font-size: 13px;
  opacity: 0.55;
}

.foot {
  margin-top: 28px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #88745c;
}
</style>
</head>

<body>

<main class="card">

  <img
    class="logo"
    src="trinakala-logo.jpg"
    alt="Trina Kala logo"
  >

  <!-- <div class="brand">TRINA KALA</div> -->

  <div class="tag">
    TRADITIONAL CRAFT • CONTEMPORARY EXPRESSION
  </div>


  <!-- Instagram -->
  <a
    class="social-link"
    href="https://www.instagram.com/trinakala_/"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">
      <i class="fa-brands fa-instagram"></i>
    </span>

    <span class="social-name">Instagram</span>

    <span class="arrow">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </span>
  </a>


  <!-- Facebook -->
  <a
    class="social-link"
    href="https://www.facebook.com/share/1H6WJQoeAz/?mibextid=wwXIfr"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">
      <i class="fa-brands fa-facebook-f"></i>
    </span>

    <span class="social-name">Facebook</span>

    <span class="arrow">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </span>
  </a>


  <!-- TikTok -->
  <a
    class="social-link"
    href="https://www.tiktok.com/@trina.kala"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">
      <i class="fa-brands fa-tiktok"></i>
    </span>

    <span class="social-name">TikTok</span>

    <span class="arrow">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </span>
  </a>


  <!-- LinkedIn -->
  <a
    class="social-link"
    href="https://www.linkedin.com/company/trina-kala/"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="icon">
      <i class="fa-brands fa-linkedin-in"></i>
    </span>

    <span class="social-name">LinkedIn</span>

    <span class="arrow">
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </span>
  </a>


  <div class="foot">
    DHAKA • HANDCRAFTED WITH HERITAGE
  </div>

</main>

</body>
</html>
