<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #2f251d;

  display: flex;
  justify-content: center;
  align-items: center;

  padding:
    clamp(18px, 4vw, 40px)
    clamp(12px, 4vw, 30px);

  position: relative;

  overflow-x: hidden;

  background: #dfcfb5;
}


/* =========================================================
   FABRIC BACKGROUND
========================================================= */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  z-index: -3;

  background-color: #dfcfb5;

  background-image:

    repeating-linear-gradient(
      0deg,
      rgba(80,55,35,.08) 0px,
      rgba(80,55,35,.08) 1px,
      transparent 1px,
      transparent 4px
    ),

    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.13) 0px,
      rgba(255,255,255,.13) 1px,
      transparent 1px,
      transparent 5px
    );
}


/* =========================================================
   DHAKA SVG
========================================================= */

.dhaka-pattern {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: -2;

  pointer-events: none;

}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

  width: min(
    430px,
    calc(100vw - 24px)
  );

  /*
    Prevent the card from becoming unnecessarily
    tall on large screens.
  */

  min-height: auto;

  text-align: center;

  background: rgba(248,242,231,.96);

  border:
    1px solid #c9b99d;

  border-radius:
    clamp(24px, 5vw, 30px);

  padding:
    clamp(24px, 6vw, 32px)
    clamp(16px, 5vw, 22px)
    clamp(22px, 5vw, 28px);

  box-shadow:
    0 18px 50px rgba(75,56,32,.18),
    0 4px 12px rgba(75,56,32,.08);

  position: relative;

  overflow: hidden;
}


/* =========================================================
   CARD FABRIC TEXTURE
========================================================= */

.card::before {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  opacity: .18;

  background-image:

    repeating-linear-gradient(
      0deg,
      rgba(80,55,35,.08) 0px,
      rgba(80,55,35,.08) 1px,
      transparent 1px,
      transparent 4px
    ),

    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.14) 0px,
      rgba(255,255,255,.14) 1px,
      transparent 1px,
      transparent 5px
    );
}


/* Keep content above texture */

.card > * {

  position: relative;

  z-index: 2;

}


/* =========================================================
   LOGO
========================================================= */

.logo {

  width:
    clamp(125px, 38vw, 155px);

  height:
    clamp(125px, 38vw, 155px);

  object-fit: contain;

  display: block;

  margin:
    0 auto
    clamp(2px, 1vw, 8px);

}


/* =========================================================
   TAGLINE
========================================================= */

.tag {

  font-size:
    clamp(10px, 2.8vw, 13px);

  letter-spacing:
    clamp(1px, .45vw, 1.8px);

  line-height: 1.65;

  margin:
    8px auto
    clamp(22px, 6vw, 30px);

  color: #75614b;

  max-width: 360px;
}


/* =========================================================
   SOCIAL LINKS
========================================================= */

.social-link {

  width: 100%;

  min-height:
    clamp(62px, 17vw, 72px);

  display: flex;

  align-items: center;

  gap:
    clamp(9px, 3vw, 15px);

  text-decoration: none;

  color: #2f251d;

  background:
    rgba(234,223,201,.90);

  border:
    1px solid #cdbb9d;

  border-radius:
    clamp(14px, 4vw, 18px);

  padding:
    clamp(10px, 3vw, 15px)
    clamp(12px, 4vw, 18px);

  margin:
    clamp(9px, 3vw, 12px)
    0;

  font-weight: 700;

  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}


/* Desktop hover */

@media (hover: hover) {

  .social-link:hover {

    transform:
      translateY(-3px);

    background:
      #dfd0b4;

    box-shadow:
      0 8px 20px rgba(75,56,32,.12);
  }

}


/* =========================================================
   ICON
========================================================= */

.icon {

  width:
    clamp(27px, 8vw, 32px);

  height:
    clamp(27px, 8vw, 32px);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size:
    clamp(19px, 6vw, 22px);

  flex-shrink: 0;

}


/* =========================================================
   SOCIAL NAME
========================================================= */

.social-name {

  flex: 1;

  text-align: left;

  font-size:
    clamp(15px, 4.5vw, 17px);

  line-height: 1.2;

}


/* =========================================================
   ARROW
========================================================= */

.arrow {

  font-size:
    clamp(11px, 3.5vw, 14px);

  opacity: .55;

  flex-shrink: 0;

}


/* =========================================================
   FOOTER
========================================================= */

.foot {

  margin-top:
    clamp(20px, 6vw, 28px);

  font-size:
    clamp(8px, 2.6vw, 11px);

  letter-spacing:
    clamp(1.2px, .6vw, 2px);

  line-height: 1.5;

  color: #88745c;

}


/* =========================================================
   TABLETS
========================================================= */

@media (min-width: 600px) {

  body {

    padding: 35px 24px;

  }

  .card {

    width: 430px;

    padding:
      30px
      22px
      26px;

  }

  .logo {

    width: 150px;

    height: 150px;

  }

  .social-link {

    min-height: 70px;

  }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

  body {

    padding:
      14px 10px;

    align-items: flex-start;

  }

  .card {

    width:
      calc(100vw - 20px);

    margin:
      8px auto;

    padding:
      22px 14px 20px;

    border-radius: 23px;

  }

  .logo {

    width: 125px;

    height: 125px;

    margin-bottom: 2px;

  }

  .tag {

    font-size: 9px;

    letter-spacing: 1px;

    margin-top: 5px;

    margin-bottom: 22px;

  }

  .social-link {

    min-height: 59px;

    padding:
      9px 11px;

    gap: 8px;

    border-radius: 14px;

  }

  .icon {

    width: 27px;

    height: 27px;

    font-size: 19px;

  }

  .social-name {

    font-size: 14px;

  }

  .arrow {

    font-size: 11px;

  }

  .foot {

    margin-top: 20px;

    font-size: 8px;

    letter-spacing: 1.4px;

  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 330px) {

  body {

    padding:
      8px;

  }

  .card {

    width:
      calc(100vw - 16px);

    padding:
      18px 11px;

  }

  .logo {

    width: 110px;

    height: 110px;

  }

  .tag {

    font-size: 8px;

    letter-spacing: .7px;

  }

  .social-link {

    min-height: 54px;

    padding:
      8px 9px;

  }

  .icon {

    width: 25px;

    font-size: 17px;

  }

  .social-name {

    font-size: 13px;

  }

  .arrow {

    font-size: 10px;

  }

}


/* =========================================================
   LANDSCAPE PHONES
========================================================= */

@media (max-height: 600px) and (orientation: landscape) {

  body {

    align-items: flex-start;

    padding:
      15px;

  }

  .card {

    margin:
      0 auto;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

  html {

    scroll-behavior: auto;

  }

  .social-link {

    transition: none;

  }

}

</style>
